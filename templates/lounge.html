<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lounge — {{ profile.name }}</title>
  <meta name="description" content="A cozy corner. Walk around, warm up by the fire.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/lounge.css') }}">
</head>
<body>

  <canvas id="scene" tabindex="0"></canvas>
  <a class="lounge-back" href="{{ url_for('index') }}">← back to the workshop</a>
  <div class="lounge-title">
    <h1>The Lounge</h1>
    <p>walk around · warm up by the fire · say hi to the cat</p>
  </div>
  <p class="lounge-hint">click the scene, then WASD / arrows to walk · drag to look · scroll to zoom</p>

  <div class="dpad" id="dpad">
    <button class="fwd" data-move="fwd">▲</button>
    <button class="left" data-move="left">◄</button>
    <button class="back" data-move="back">▼</button>
    <button class="right" data-move="right">►</button>
  </div>

  <div class="music-panel">
    <div class="music-head" id="music-toggle"><span>♪ now playing</span><span class="toggle">▾</span></div>
    <div class="music-body" id="music-body">
      <div class="music-frame">
      
        <iframe src="https://www.youtube-nocookie.com/embed/txvYcUGUzaQ?autoplay=0" title="Lofi radio" loading="lazy" allow="autoplay; encrypted-media" allowfullscreen></iframe>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="{{ url_for('static', filename='js/lounge.js') }}"></script>
</body>
</html>
