<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ profile.name }} — {{ profile.role }}{% endblock %}</title>
  <meta name="description" content="{{ profile.tagline }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

  <!-- Point-cloud background: fixed canvas behind everything -->
  <canvas id="pointcloud" aria-hidden="true"></canvas>

  <header class="site-header">
    <nav class="nav" aria-label="Main">
      <a class="nav-brand" href="{{ url_for('index') }}">
        <span class="brand-mark">◇</span> negin<span class="brand-accent">.amou</span>
      </a>
      <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-links">
        {% block nav %}
        <li><a href="{{ url_for('index') }}">Home</a></li>
        <li><a href="{{ url_for('writings_index') }}">Writings</a></li>
        {% endblock %}
      </ul>
    </nav>
  </header>

  <main id="content">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p class="footer-note">
        <span class="mono">// {{ profile.name }}</span> · {{ profile.location }}
      </p>
      <ul class="social-links">
        {% for link in profile.social %}
        <li>
          <a href="{{ link.url }}" {% if not link.url.startswith('mailto') %}target="_blank" rel="noopener"{% endif %}>
            {% include 'icons/' + link.icon + '.svg' ignore missing %}
            <span>{{ link.label }}</span>
          </a>
        </li>
        {% endfor %}
      </ul>
    </div>
  </footer>

  <script src="{{ url_for('static', filename='js/pointcloud.js') }}"></script>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
