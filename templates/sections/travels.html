<section class="section" id="{{ section.id }}">
  <div class="section-inner">
    <h2 class="section-title"><span class="mono section-label">[ atlas ]</span> {{ section.title }}</h2>
    <p class="section-lede">Spin the globe. Every pin is somewhere I've been — hover for a postcard.</p>
    <div class="globe-frame-wrap">
      <iframe src="{{ url_for('travels') }}"
              class="globe-frame"
              loading="lazy"
              title="Places I've been"></iframe>
    </div>
  </div>
</section>
