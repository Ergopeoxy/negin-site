<section class="section" id="{{ section.id }}">
  <div class="section-inner section-narrow">
    <h2 class="section-title"><span class="mono section-label">[ off_the_clock ]</span> {{ section.title }}</h2>
    <a class="lounge-teaser card" href="{{ url_for('lounge') }}">
      <div class="lounge-teaser-text">
        <h3>Come relax in my lounge</h3>

      </div>

    </a>
  </div>
</section>
